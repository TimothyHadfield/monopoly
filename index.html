<body>
<div id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="3" y="3" width="26" height="7" rx="3" fill="#e0413a"/><circle cx="12" cy="20" r="2.6" fill="currentColor"/><circle cx="20" cy="20" r="2.6" fill="currentColor"/></svg><span>Monopoly</span></div>
    <nav class="tabs-top" id="tabsTop" aria-label="Sections"></nav>
    <button type="button" class="pf-open me-btn" id="meBtn" aria-label="My stats" hidden></button>
    <span class="ver" id="ver"></span>
  </header>
  <main id="main" class="tbl-surface tbl-wood-dark">
    <section class="seats" id="seats" hidden></section>
    <section class="board-col"><div class="board-wrap" id="boardWrap"><div class="cam" id="cam"><svg id="board" viewBox="0 0 1000 1000" role="img" aria-label="Board"></svg><div class="mdeck chest" id="deckChest" aria-hidden="true"></div><div class="mdeck chance" id="deckChance" aria-hidden="true"></div></div><div class="cbox" id="cbox"><div class="center" id="center"></div><button class="zoomb" id="zoomBtn" data-act="zoom" hidden></button></div></div></section>
    <section class="mine" id="mine" hidden></section>
    <section class="panel-col" id="panel"></section>
  </main>
  <nav class="tabs-bottom" id="tabsBottom" aria-label="Sections"></nav>
</div>
